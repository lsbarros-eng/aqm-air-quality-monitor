<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">AQM v0.1.0 — Breadboard Prototype</title>
  <desc id="desc">Didactic wiring illustration of an ESP32 connected by a shared I2C bus to an SSD1306 OLED, SCD41, BME280 and DS3231 RTC. All modules use 3.3 volts, ground, GPIO21 for SDA and GPIO22 for SCL.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#256b58"/>
      <stop offset="1" stop-color="#12483d"/>
    </linearGradient>
    <pattern id="holes" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="2.8" fill="#d8dee7"/>
    </pattern>
    <style>
      .title{font:700 42px Inter,Arial,sans-serif;fill:#172033}.subtitle{font:400 20px Inter,Arial,sans-serif;fill:#526076}.label{font:700 22px Inter,Arial,sans-serif;fill:#172033}.small{font:500 17px Inter,Arial,sans-serif;fill:#526076}.tiny{font:600 14px Inter,Arial,sans-serif;fill:#344157}.pin{font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace}.wire{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.branch{fill:none;stroke-width:5;stroke-linecap:round}.card{fill:#fff;stroke:#d8e0ea;stroke-width:2}.chip{fill:#172033;stroke:#445067;stroke-width:2}.pad{fill:#d7b34a;stroke:#9d7b1c;stroke-width:1}.callout{fill:#f4f7fb;stroke:#cdd7e5;stroke-width:2}.bus-label{font:700 17px Inter,Arial,sans-serif}.white{fill:#fff}.center{text-anchor:middle}
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1600" height="122" fill="#eaf0f7"/>
  <text x="70" y="58" class="title">AQM v0.1.0 — Breadboard Prototype</text>
  <text x="72" y="92" class="subtitle">Air Quality Monitor · as-built wiring overview · ESP32 shared I²C bus</text>

  <!-- ESP32 assembly -->
  <g>
    <rect x="65" y="177" width="430" height="690" rx="28" class="card"/>
    <text x="280" y="220" class="label center">ESP32 DevKit + expansion board</text>
    <rect x="120" y="250" width="320" height="560" rx="18" fill="#202938"/>
    <rect x="152" y="275" width="256" height="510" rx="15" fill="url(#board)"/>
    <rect x="188" y="292" width="184" height="126" rx="9" fill="#c7ced8" stroke="#8b97a8" stroke-width="3"/>
    <path d="M207 315h146M207 335h146M207 355h146M207 375h146" stroke="#8e9aaa" stroke-width="3"/>
    <rect x="197" y="444" width="166" height="118" rx="9" class="chip"/>
    <text x="280" y="494" class="white center" style="font:700 22px Inter,Arial,sans-serif">ESP32</text>
    <text x="280" y="525" class="white center" style="font:500 15px Inter,Arial,sans-serif">240 MHz · Wi-Fi</text>
    <rect x="244" y="703" width="72" height="53" rx="6" fill="#b9c2cf"/>
    <rect x="258" y="714" width="44" height="30" rx="3" fill="#394456"/>
    <text x="280" y="838" class="small center">Powered through USB</text>

    <!-- pins -->
    <circle cx="438" cy="475" r="11" fill="#dc3b3b"/><text x="414" y="481" class="pin" text-anchor="end" fill="#dc3b3b">3V3</text>
    <circle cx="438" cy="545" r="11" fill="#252a32"/><text x="414" y="551" class="pin" text-anchor="end" fill="#252a32">GND</text>
    <circle cx="438" cy="615" r="11" fill="#2f72d6"/><text x="414" y="621" class="pin" text-anchor="end" fill="#2f72d6">GPIO21</text>
    <circle cx="438" cy="685" r="11" fill="#e5ae18"/><text x="414" y="691" class="pin" text-anchor="end" fill="#a36d00">GPIO22</text>
  </g>

  <!-- Shared bus backbone -->
  <path d="M449 475H625V820" class="wire" stroke="#dc3b3b"/>
  <path d="M449 545H660V820" class="wire" stroke="#252a32"/>
  <path d="M449 615H695V820" class="wire" stroke="#2f72d6"/>
  <path d="M449 685H730V820" class="wire" stroke="#e5ae18"/>
  <rect x="535" y="153" width="280" height="76" rx="17" class="callout"/>
  <text x="675" y="184" class="label center">Shared I²C bus</text>
  <text x="675" y="210" class="small center">four wires · four modules</text>

  <!-- Bus labels -->
  <g>
    <rect x="545" y="276" width="154" height="36" rx="18" fill="#fff0f0"/><circle cx="565" cy="294" r="7" fill="#dc3b3b"/><text x="582" y="300" class="bus-label" fill="#b12727">3.3 V</text>
    <rect x="545" y="325" width="154" height="36" rx="18" fill="#eef0f2"/><circle cx="565" cy="343" r="7" fill="#252a32"/><text x="582" y="349" class="bus-label" fill="#252a32">GND</text>
    <rect x="545" y="374" width="154" height="36" rx="18" fill="#edf4ff"/><circle cx="565" cy="392" r="7" fill="#2f72d6"/><text x="582" y="398" class="bus-label" fill="#235cae">SDA · 21</text>
    <rect x="545" y="423" width="154" height="36" rx="18" fill="#fff8df"/><circle cx="565" cy="441" r="7" fill="#e5ae18"/><text x="582" y="447" class="bus-label" fill="#966500">SCL · 22</text>
  </g>

  <!-- Modules -->
  <g>
    <!-- OLED -->
    <rect x="850" y="153" width="650" height="156" rx="24" class="card"/>
    <rect x="890" y="184" width="210" height="96" rx="10" fill="#1d2533"/>
    <rect x="909" y="199" width="172" height="66" rx="4" fill="#0c2545" stroke="#5ec4ff" stroke-width="2"/>
    <text x="995" y="228" class="white center" style="font:700 16px ui-monospace,monospace">CO₂ 830 ppm</text>
    <text x="995" y="250" class="white center" style="font:500 13px ui-monospace,monospace">T 22.9°C · RH 69%</text>
    <text x="1140" y="203" class="label">OLED SSD1306</text><text x="1140" y="234" class="small">0.96-inch display</text>
    <rect x="1362" y="184" width="98" height="36" rx="18" fill="#eaf4ff"/><text x="1411" y="208" class="tiny center" fill="#235cae">0x3C</text>
    <text x="1140" y="271" class="tiny">VCC · GND · SDA · SCL</text>

    <!-- SCD41 -->
    <rect x="850" y="337" width="650" height="156" rx="24" class="card"/>
    <rect x="895" y="364" width="190" height="102" rx="10" fill="#2c3f92"/>
    <rect x="945" y="379" width="92" height="73" rx="10" fill="#d7dce4" stroke="#9aa5b3" stroke-width="3"/>
    <circle cx="970" cy="415" r="12" fill="#909baa"/><circle cx="1012" cy="415" r="12" fill="#909baa"/>
    <text x="1140" y="386" class="label">Sensirion SCD41</text><text x="1140" y="417" class="small">CO₂ · temperature · humidity</text>
    <rect x="1362" y="368" width="98" height="36" rx="18" fill="#eaf4ff"/><text x="1411" y="392" class="tiny center" fill="#235cae">0x62</text>
    <text x="1140" y="454" class="tiny">VIN · GND · SDA · SCL</text>

    <!-- BME280 -->
    <rect x="850" y="521" width="650" height="156" rx="24" class="card"/>
    <rect x="910" y="548" width="160" height="102" rx="9" fill="#663897"/>
    <rect x="959" y="573" width="62" height="52" rx="4" fill="#c6ccd4" stroke="#929daa" stroke-width="3"/>
    <circle cx="933" cy="571" r="5" class="pad"/><circle cx="933" cy="595" r="5" class="pad"/><circle cx="933" cy="619" r="5" class="pad"/>
    <text x="1140" y="570" class="label">Bosch BME280</text><text x="1140" y="601" class="small">temperature · humidity · pressure</text>
    <rect x="1362" y="552" width="98" height="36" rx="18" fill="#eaf4ff"/><text x="1411" y="576" class="tiny center" fill="#235cae">0x76</text>
    <text x="1140" y="638" class="tiny">VCC · GND · SDA · SCL</text>

    <!-- RTC -->
    <rect x="850" y="705" width="650" height="156" rx="24" class="card"/>
    <rect x="895" y="732" width="190" height="102" rx="9" fill="#174e88"/>
    <circle cx="1031" cy="783" r="37" fill="#c4cbd4" stroke="#8995a5" stroke-width="3"/>
    <rect x="910" y="758" width="72" height="48" rx="5" class="chip"/>
    <text x="1140" y="754" class="label">RTC DS3231</text><text x="1140" y="785" class="small">battery-backed real-time clock</text>
    <rect x="1362" y="736" width="98" height="36" rx="18" fill="#eaf4ff"/><text x="1411" y="760" class="tiny center" fill="#235cae">0x68</text>
    <text x="1140" y="822" class="tiny">VCC · GND · SDA · SCL</text>
  </g>

  <!-- branches to each module -->
  <g>
    <path d="M625 257H850" class="branch" stroke="#dc3b3b"/><path d="M660 269H850" class="branch" stroke="#252a32"/><path d="M695 281H850" class="branch" stroke="#2f72d6"/><path d="M730 293H850" class="branch" stroke="#e5ae18"/>
    <path d="M625 441H850" class="branch" stroke="#dc3b3b"/><path d="M660 453H850" class="branch" stroke="#252a32"/><path d="M695 465H850" class="branch" stroke="#2f72d6"/><path d="M730 477H850" class="branch" stroke="#e5ae18"/>
    <path d="M625 625H850" class="branch" stroke="#dc3b3b"/><path d="M660 637H850" class="branch" stroke="#252a32"/><path d="M695 649H850" class="branch" stroke="#2f72d6"/><path d="M730 661H850" class="branch" stroke="#e5ae18"/>
    <path d="M625 809H850" class="branch" stroke="#dc3b3b"/><path d="M660 821H850" class="branch" stroke="#252a32"/><path d="M695 833H850" class="branch" stroke="#2f72d6"/><path d="M730 845H850" class="branch" stroke="#e5ae18"/>
  </g>

  <!-- footer -->
  <rect x="65" y="900" width="1435" height="52" rx="15" fill="#172033"/>
  <text x="92" y="933" class="white" style="font:600 17px Inter,Arial,sans-serif">Electrical note:</text>
  <text x="228" y="933" class="white" style="font:400 17px Inter,Arial,sans-serif">all four modules are powered at 3.3 V · common ground · SDA = GPIO21 · SCL = GPIO22</text>
  <text x="1468" y="933" class="white" text-anchor="end" style="font:600 15px ui-monospace,monospace">AQM / v0.1.0</text>
</svg>
